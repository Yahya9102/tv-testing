name: Kontrollera kanalernas strömadresser

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *' # dagligen 09:15 UTC

permissions:
  contents: write

concurrency:
  group: tv-testing-git-writes
  cancel-in-progress: false

jobs:
  check-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Hämta repository
        uses: actions/checkout@v4
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testa kurdiska strömmar i huvudlistan
        run: |
          python scripts/check_streams.py --playlist playlists/all.m3u --group Kurdiska --report reports/kurdistan-health.md --json reports/kurdistan-health.json --workers 12 --timeout 8
      - name: Testa persiska strömmar i huvudlistan
        run: |
          python scripts/check_streams.py --playlist playlists/all.m3u --group Persiska --report reports/persian-health.md --json reports/persian-health.json --workers 12 --timeout 8
      - name: Testa irakiska strömmar i huvudlistan
        run: |
          python scripts/check_streams.py --playlist playlists/all.m3u --group Irakiska --report reports/iraq-health.md --json reports/iraq-health.json --workers 12 --timeout 8
      - name: Publicera kontrollrapporter
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Inga nya rapporter."
          else
            git commit -m "Uppdatera kontrollrapport för TV-strömmar"
            git push
          fi
