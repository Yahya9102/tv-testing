name: Uppdatera IPTV-spellistor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *' # dagligen 04:17 UTC
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config.json'
      - 'sources/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Hamta repository
        uses: actions/checkout@v4
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollera tester
        run: python -m unittest discover -s tests -v
      - name: Bygg alla listor
        run: python scripts/build.py
      - name: Publicera nya spellistor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/
          if git diff --cached --quiet; then
            echo "Inget nytt att publicera."
          else
            git commit -m "Uppdatera oppna IPTV-spellistor"
            git push
          fi
