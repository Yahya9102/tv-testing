name: Kontrollera kurdiska TV-kanaler

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *' # Dagligen 09:15 UTC (sommartid 11:15 i Sverige)

permissions:
  contents: write

jobs:
  check-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hämta repository
        uses: actions/checkout@v4
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kör enhetstester
        run: python -m unittest discover -s tests -v
      - name: Kontrollera M3U8 och mediasegment
        run: python scripts/check_streams.py --playlist playlists/kurdistan.m3u
      - name: Spara kontrollrapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/kurdistan-health.md reports/kurdistan-health.json
          if git diff --cached --quiet; then
            echo "Ingen rapport att publicera."
          else
            git commit -m "Uppdatera kanalernas kontrollrapport"
            git push
          fi
